schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

context: |
  Follow CONTRIBUTING.md for branches. Each change lives on its own branch
  `<type>/<change-name>` (type: feat, fix or chore), cut from `develop`.
  Create the branch before writing the first artifact, so propose, apply and
  archive all land on that branch. Never commit to `main`.

rules:
  tasks:
    - End with a `## Workflow follow-up` section naming the `<type>/<change-name>` branch and the archive and `--no-ff` merge into `develop`

operations:
  apply:
    guidance:
      - Before the first edit, check that the current branch is the change's `<type>/<change-name>` branch. If it is not, stop and ask
  archive:
    guidance:
      - Archive on the change branch, commit there, then merge into `develop` with `git merge --no-ff` and delete the branch with `git branch -d`
